name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements-ci.txt ruff
      - run: ruff check --select E9,F63,F7,F82 .
      - run: python -m compileall -q apps experiments scripts docs tests
      - run: pytest -q tests
